services:
  # Compila o APK e serve em http://localhost:8080/matilha.apk
  app:
    build: .
    image: matilha-build
    env_file: .env
    command: ["serve"]
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    volumes:
      - gradle:/gradle        # cache do Gradle (builds seguintes ficam rápidos)
      - keys:/keys            # keystore gerada na 1ª execução (mantém a mesma assinatura)
      - ./dist:/out           # APK também fica em ./dist no seu computador

  # Roda todos os testes: docker compose run --rm test
  test:
    image: matilha-build
    build: .
    env_file: .env
    command: ["test"]
    profiles: ["test"]
    volumes:
      - gradle:/gradle
      - robolectric:/app/app/build/robolectric-deps   # runtimes Android dos testes (~250 MB, baixa 1 vez)
      - ./screens:/screens

volumes:
  gradle:
    name: matilha_gradle
  keys:
    name: matilha_keys
  robolectric:
    name: matilha_robolectric
